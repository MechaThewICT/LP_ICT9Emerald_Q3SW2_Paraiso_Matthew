<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Fluffy and Ein's Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
    <style>
        .small-container{
            width: 27%;
        }
        .very-small-container{
            width: 10%;
        }
        button{
            border-radius: 10px;
            font-size: 22px;
        }
        input{
            font-size: 25px;
        }
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-image: url(CALCULATOR.png);
            background-size: cover;
            background-position-y: -69px;
        }
        button:hover{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container bg-success text-white mt-5 p-3 text-center small-container rounded" style="box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75);
    -webkit-box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75);
    -moz-box-shadow: 10px 10px 5px 0px rgba(0,0,0,0.75);">
    <form>
        <br>
        <input type="number" id="num1" placeholder="1st Variable..">
        <br>
        <br>
            <input type="number" id="num2" placeholder="2nd Variable..">
        <br>
        <br>
        <span> <h2 id="result" style="background-color: rgb(167, 167, 167); border-radius: 10px;"> The answer is... </h2> </span>
        <br>
            <button type="button" onclick="product()"> Product of A and B </button>
            <button type="button" onclick="exponent()"> A raise to B </button><br><br>
            <button type="button" onclick="modulus()"> get the remainder </button>
            <button type="button" onclick="comparison()"> Check if A = B </button>

            <br>
            <br>
            <details ontoggle ="message()">
                <summary style="font-size: 20px;">Instructions</summary>
                <i style="font-size: 20px;">Type in your first variable and your second variable. Choose one of the four buttons to see the answer between those questions.</i>
            </details>
    </form>
    </div>

    <script>
        function message() {
            alert("Please try the calculator...");
        }

        function product (){
            var numb1 = document.getElementById("num1").value;
            var numb2 = document.getElementById("num2").value;
            var sum = Number(numb1) * Number (numb2);

            document.getElementById('result').innerHTML= 'The answer is' + ' ' + sum;
        }
        function exponent (){
            var numb1 = document.getElementById("num1").value;
            var numb2 = document.getElementById("num2").value;
            var sum = Number(numb1) ** Number (numb2);

            document.getElementById('result').innerHTML= 'The answer is' + ' ' + sum;
        }
        function modulus (){
            var numb1 = document.getElementById("num1").value;
            var numb2 = document.getElementById("num2").value;
            var sum = Number(numb1) % Number (numb2);

            document.getElementById('result').innerHTML= 'The answer is' + ' ' + sum;
        }
        function comparison (){
            var numb1 = document.getElementById("num1").value;
            var numb2 = document.getElementById("num2").value;
            var sum = Number(numb1) == Number (numb2);

            document.getElementById('result').innerHTML= 'The answer is' + ' ' + sum;
        }
    </script>
</body>
</html>
